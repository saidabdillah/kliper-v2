name: Native ClipFlow checks
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - run: python -m venv .venv && .venv/bin/python -m pip install -r requirements.txt playwright
      - run: .venv/bin/python -m playwright install --with-deps chromium
      - run: node --check web/studio.js && node --check web/tracks.js && .venv/bin/python -m unittest discover -s tests -v
      - run: .venv/bin/python tests/browser_phase1.py && .venv/bin/python tests/browser_editor.py
      - name: Real AI selection, browser editing and export
        env:
          HF_HUB_DISABLE_XET: '1'
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          set -o pipefail
          .venv/bin/python tests/browser_ai.py 2>&1 | tee "$RUNNER_TEMP/ai.log" || {
            python -c "import os,pathlib; t=pathlib.Path(os.environ['RUNNER_TEMP'],'ai.log').read_text();print('::error::'+t[-6000:].replace('%','%25').replace('\n','%0A'))"
            exit 1
          }
